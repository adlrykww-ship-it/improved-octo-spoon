<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة الجنينة - كتب كاملة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;800&display=swap');
*{font-family:'Tajawal',sans-serif;box-sizing:border-box}
body{margin:0;background:#2b1a0e;color:#f5e6c8;padding-bottom:90px}
.top{background:#1a0e05;padding:8px 12px;display:flex;justify-content:space-between;font-size:13px}
.head{background:#221208;padding:14px;text-align:center;border-bottom:2px solid #c9a86a}
.books{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.book{background:#fff7e8;border-radius:15px;overflow:hidden;color:#221208}
.cover{height:120px;background:#4a2c16;display:flex;align-items:center;justify-content:center;color:#ffd54f;padding:10px;text-align:center;font-weight:800;font-size:13px}
.info{padding:8px;text-align:center;font-size:12px}
.btn{background:#221208;color:#ffd54f;padding:8px;border-radius:8px;display:block;text-align:center;margin-top:6px;cursor:pointer;border:none;width:100%}
.btn-green{background:#145a14}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#221208;border-top:2px solid #c9a86a;display:flex;justify-content:space-around;padding:10px 0;z-index:99}
.bottom div{cursor:pointer;text-align:center;font-size:11px;color:#f9e4a6;flex:1}
#reader{position:fixed;top:0;left:0;right:0;bottom:0;background:#fdf6e3;z-index:999;display:none;flex-direction:column;color:#221208}
#readerTop{background:#221208;color:#f9e4a6;padding:12px;display:flex;justify-content:space-between;position:sticky;top:0}
#readerContent{padding:20px 18px;line-height:2.1;font-size:18px;overflow:auto;white-space:pre-wrap;text-align:justify}
</style>
</head>
<body>
<div class="top"><span id="vis">👁️ الزوار:...</span><span id="userTop" onclick="showAccount()">👤 حسابي</span></div>
<div class="head"><h2 style="margin:0;color:#f9e4a6">📚 مكتبة الجنينة الرقمية</h2><small>كتب كاملة - اقلب الصفحات لتحت</small></div>
<div class="books" id="books"></div>

<div class="bottom">
<div onclick="showAccount()">👤<br>حسابي</div>
<div onclick="showFavs()">🔖<br>محفوظاتي</div>
<div onclick="goHome()">🏠<br>الرئيسية</div>
</div>

<div id="reader">
<div id="readerTop"><span id="rTitle"></span><span onclick="closeReader()" style="cursor:pointer;background:#c9a86a;color:#000;padding:6px 14px;border-radius:8px">✕ قفل</span></div>
<div id="readerContent"></div>
</div>

<script>
let allBooks=[
{name:"الأمثال الدارفورية - كتاب كامل",cat:"تراث",content:`
📚 كتاب الأمثال الدارفورية - جمع أهل الجنينة
[نفس المحتوى الكامل السابق - 1626 حرف]
1- الجمل ما بشوف عوجة رقبتو - القصة والشرح كامل...
2- الايد الواحدة ما بتصفق - قصة الحصاد في وادي كجا...
3- جرادة في الكف ولا ألف طايرة...
4- أهل مكة أدرى بشعابها...
الفصل الثاني: أمثال عن الكرم - الضيف ضيف الله...
الخاتمة: الأمثال دي تاريخ دارفور كلو...
`},
{name:"حكاية السلطان تاج الدين - كاملة",cat:"دار",content:`
📚 حكاية السلطان تاج الدين
الفصل الأول: من هو تاج الدين؟ سلطان دار مساليت العادل...
الفصل الثاني: قصة المسكين والبقرة - السلطان مشى بنفسه...
الفصل الثالث: حكمه المشهور...
الفصل الرابع: وفاته وهو ساجد...
رواها الحاج إبراهيم - حي الزهور
`},
{name:"تاريخ الجنينة - من التأسيس لليوم",cat:"دار",content:`
📚 تاريخ مدينة الجنينة
الباب الأول: لماذا سميت الجنينة؟ كانت كلها جناين...
الباب الثاني: تأسيس سلطنة دار مساليت قبل 400 سنة...
الباب الثالث: معركة كرندق ضد الإنجليز...
الباب الرابع: أحياء الجنينة - الزهور، الجبل، السلام...
الباب الخامس: الجنينة اليوم 500 ألف نسمة...
`},
{name:"موسم الهجرة - القصة الكاملة",cat:"أدب",content:`
📚 موسم الهجرة إلى الشمال - الطيب صالح
الفصل الأول: العودة من لندن...
الفصل الثاني: مصطفى سعيد الغامض...
الفصل الثالث: مصطفى في لندن وانتقامه...
الفصل الرابع: اختفاء مصطفى في النيل...
الفصل الخامس: المعنى - صراع الهوية السودانية...
`}
];

// نفس الكتب الطويلة من النسخة الفاتت - استخدمها
allBooks[0].content=`📚 كتاب الأمثال الدارفورية - جمع أهل الجنينة

المقدمة:
الأمثال في دارفور هي مدرسة كاملة. الحبوبات في الجنينة ما كانو بقرو كتب، لكن كان عندهم حكمة في مثل واحد.

الفصل الأول: أمثال عن الحكمة
1- "الجمل ما بشوف عوجة رقبتو"
القصة: مرة في سوق الجنينة، واحد بقى يضحك على جمل صاحبو رقبتو عوجاء. صاحب الجمل قال ليهو: وجملك انت؟ الزول عاين لقى جملو رقبتو أعوج أكتر.
المعنى: الناس بتشوف عيب غيرها وما بتشوف عيبها.

2- "الايد الواحدة ما بتصفق"
القصة: في موسم الحصاد في وادي كجا، الناس كلها بتطلع تحصد سوا.
المعنى: التعاون مهم.

3- "جرادة في الكف ولا ألف طايرة"
القصة: صياد في الجنينة شاف ألف جرادة طايرة، جرى وراها، وفي يدو جرادة واحدة وقعت.
المعنى: القليل المضمون أحسن من الكثير الما مضمون.

4- "أهل مكة أدرى بشعابها"
في مشاكل دار مساليت، أهل الجنينة أدرى بمشاكلها.

الفصل الثاني: أمثال عن الكرم
"الضيف ضيف الله" - لو جاك ضيف حتى لو ما عندك إلا كسرة واحدة بتقسمها معاهو.
"الجود بالموجود"

الخاتمة: الأمثال دي تاريخ دارفور كلو مكتوب في جملة واحدة.
جمع: مكتبة الجنينة - سوق الجنينة الكبير - 2026
`;

allBooks[1].content=`📚 حكاية السلطان تاج الدين - سلطان دار مساليت العادل

الفصل الأول: من هو تاج الدين؟
السلطان تاج الدين من أشهر سلاطين دار مساليت. حكم في زمن كان فيه العدل قليل. كان ساكن في الجنينة، قصر من الطين والقش، لكن هيبتو كانت تملأ دارفور.

الفصل الثاني: قصة المسكين والبقرة
جاء راجل مسكين من وادي كجا قال: يا سلطان، جاري شال بقرتي.
السلطان: عندك شهود؟ المسكين: ما عندي إلا الله.
السلطان قام بنفسه مشى مع المسكين لبيت الغني، لقى البقرة مربوطة.
حكم: البقرة ترجع للمسكين، والغني يدفع غرامة 2 بقرة.

ومن يومها، أهل الجنينة بقو يقولو: "عدل تاج الدين".

الفصل الثالث: حكمه المشهور
"لو سرق الغني تقطع يدو، ولو سرق الفقير تقطع يد الحاكم"

الفصل الرابع: وفاته
مات وهو ساجد بعد صلاة الفجر. دفنوه في الجنينة.

رواها: الحاج إبراهيم - 85 سنة - حي الزهور
`;

allBooks[2].content=`📚 تاريخ مدينة الجنينة - غرب دارفور

الباب الأول: لماذا سميت الجنينة؟
زمان المنطقة دي كانت كلها جناين وخضرة. وادي كجا مليان موية. المسافرين بقولو: "دخلنا الجنينة" يعني دخلنا مكان الجناين.

الباب الثاني: تأسيس سلطنة دار مساليت
قبل 400 سنة اجتمعو كبار القبائل واختارو أول سلطان. السلطنة كانت بتحكم بالشورى، مجلس من 12 راجل حكيم.

الباب الثالث: الجنينة في الاستعمار
معركة كرندق مشهورة، أهل الجنينة هزمو الإنجليز.

الباب الرابع: أحياء الجنينة
1- حي الزهور أقدم حي
2- حي الجبل فوق الجبل
3- حي السلام
4- السوق الكبير قلب الجنينة
5- وادي كجا المتنفس

الباب الخامس: الجنينة اليوم
أكثر من 500 ألف نسمة. فيها جامعة الجنينة، مستشفى كبير.
رغم الحرب، أهل الجنينة ما طلعو، قعدو عمروها.

الباب السادس: مستقبل الجنينة
الجنينة حتبقى عاصمة الثقافة في دارفور.
تأليف: شباب مكتبة الجنينة - 2026
`;

allBooks[3].content=`📚 موسم الهجرة إلى الشمال - الطيب صالح - النسخة الكاملة المختصرة

الفصل الأول: العودة
الراوي رجع من لندن بعد 7 سنين. لقى زول جديد اسمو مصطفى سعيد غامض ساكن في القرية.

الفصل الثاني: التعارف
مصطفى سكر وقال قصيدة بالإنجليزي. عزم الراوي لبيتو، لقى أوضة سرية مليانة كتب إنجليزية.

الفصل الثالث: مصطفى في لندن
مصطفى كان عبقري. مشى لندن صغير، درس اقتصاد. كان داير ينتقم من الاستعمار فبقى يغوي البنات الإنجليزيات.

اتزوج جين موريس، العلاقة كانت مسمومة. في النهاية قتلها؟

الفصل الرابع: العودة للسودان
رجع اتزوج حسنة وعاش بسيط. لكن ماضيه ما خلاهو. اختفى في النيل.

الفصل الخامس: المعنى
نحن السودانيين بين ثقافتين. لازم نلقى هويتنا. الهجرة ما بس سفر، هجرة جوا النفس.

رواية لازم أي سوداني يقراها.
`;

let favs=JSON.parse(localStorage.getItem('favs')||'[]');
fetch('https://api.countapi.xyz/hit/geneina-full-fixed-2026/visits').then(r=>r.json()).then(d=>{
document.getElementById('vis').innerText='👁️ الزوار: '+d.value;
}).catch(()=>{document.getElementById('vis').innerText='👁️ الزوار: 6+';});

function render(list){
document.getElementById('books').innerHTML=list.map((b,i)=>`
<div class="book"><div class="cover">${b.name}</div>
<div class="info">${b.name}<br><span style="background:#c8e6c9;padding:3px 10px;border-radius:10px">📖 ${b.content.length} حرف</span>
<button class="btn" onclick="addFav('${b.name}')">⭐ حفظ</button>
<button class="btn btn-green" onclick="readReal(${allBooks.indexOf(b)})">📖 اقرا الكتاب كامل</button>
</div></div>`).join('');
}
function readReal(i){
let b=allBooks[i];
document.getElementById('rTitle').innerText=b.name;
document.getElementById('readerContent').innerText=b.content;
document.getElementById('reader').style.display='flex';
}
function closeReader(){document.getElementById('reader').style.display='none';}
function addFav(name){if(!favs.includes(name)){favs.push(name); localStorage.setItem('favs',JSON.stringify(favs)); alert('✅ تم حفظ '+name)}else{alert('محفوظ قبل كده')}}
function showFavs(){
if(favs.length==0){alert('🔖 لسه ما حفظت أي كتاب\nدوس حفظ ⭐'); return;}
let list=favs.map((f,idx)=> (idx+1)+'. '+f).join('\n');
alert('🔖 محفوظاتك:\n\n'+list);
}
function showAccount(){
let name=localStorage.getItem('geneina_user')||'زائر';
let newName=prompt('👤 حسابي\nاسمك الحالي: '+name+'\n\nداير تغير اسمك؟ اكتب اسم جديد:',name);
if(newName){localStorage.setItem('geneina_user',newName); document.getElementById('userTop').innerText='👤 '+newName; alert('✅ تم حفظ اسمك: '+newName);}
}
function goHome(){render(allBooks); window.scrollTo(0,0)}
let savedUser=localStorage.getItem('geneina_user');
if(savedUser){document.getElementById('userTop').innerText='👤 '+savedUser;}
render(allBooks);
</script>
</body>
</html>
