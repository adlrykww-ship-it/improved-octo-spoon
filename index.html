<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>مكتبة الجنينة - 50 صفحة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
*{font-family:'Tajawal',sans-serif;box-sizing:border-box}
body{margin:0;background:#2b1a0e;color:#f5e6c8;padding-bottom:85px}
.top{background:#1a0e05;padding:10px 14px;display:flex;justify-content:space-between;font-size:13px;border-bottom:1px solid #c9a86a}
.head{background:#221208;padding:14px;text-align:center;border-bottom:2px solid #c9a86a}
.books{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.book{background:#fff7e8;border-radius:16px;overflow:hidden;color:#221208}
.cover{height:120px;background:#4a2c16;display:flex;align-items:center;justify-content:center;color:#ffd54f;padding:10px;text-align:center;font-weight:800;font-size:13px}
.info{padding:8px;text-align:center;font-size:12px}
.btn{background:#221208;color:#ffd54f;padding:8px;border-radius:8px;display:block;text-align:center;margin-top:6px;cursor:pointer;border:none;width:100%;font-weight:700}
.btn-green{background:#145a14}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#221208;border-top:2px solid #c9a86a;display:flex;justify-content:space-around;padding:10px 0;z-index:99}
.bottom div{cursor:pointer;text-align:center;font-size:12px;color:#f9e4a6;flex:1}
#reader{position:fixed;top:0;left:0;right:0;bottom:0;background:#fdf6e3;z-index:1000;display:none;flex-direction:column;color:#221208}
#readerTop{background:#221208;color:#f9e4a6;padding:12px;display:flex;justify-content:space-between;align-items:center}
#readerContent{padding:22px 18px;line-height:2.3;font-size:18px;white-space:pre-wrap;text-align:justify;flex:1;overflow:auto}
#pageCtrl{background:#fff7e8;border-top:2px solid #c9a86a;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;bottom:0}
#pageCtrl button{background:#221208;color:#ffd54f;border:none;padding:12px 20px;border-radius:12px;font-weight:800;cursor:pointer;flex:1;font-size:14px}
#pageCtrl button:disabled{background:#ccc;color:#666}
#pageInfo{font-weight:800;color:#221208;text-align:center;min-width:100px;font-size:14px}
#progress{height:6px;background:#c9a86a;width:0%;transition:width 0.3s}
</style>
</head>
<body>
<div class="top"><span id="vis">👁️ الزوار:...</span><span id="userTop" onclick="showAccount()">👤 حسابي</span></div>
<div class="head"><h2 style="margin:0;color:#f9e4a6">📚 مكتبة الجنينة</h2><small>كتب 50 صفحة - قلب الصفحات</small></div>
<div id="progress"></div>
<div class="books" id="books"></div>
<div class="bottom">
<div onclick="showAccount()">👤<br>حسابي</div>
<div onclick="showFavs()">🔖<br>محفوظاتي</div>
<div onclick="goHome()">🏠<br>الرئيسية</div>
</div>

<div id="reader">
<div id="readerTop"><span id="rTitle"></span><span onclick="closeReader()" style="background:#c9a86a;color:#000;padding:7px 16px;border-radius:10px;cursor:pointer">✕ قفل</span></div>
<div id="readerContent"></div>
<div id="pageCtrl">
<button id="prevBtn" onclick="prevPage()">⬅️ السابق</button>
<span id="pageInfo">1 / 50</span>
<button id="nextBtn" onclick="nextPage()">التالي ➡️</button>
</div>
</div>

<script>
function genBook(title, cat, intro){
let pages=[];
for(let i=1;i<=50;i++){
let txt=`الصفحة ${i} - ${title}\n\n`;
if(i==1) txt+=`${intro}\n\nهذا الكتاب يتكون من 50 صفحة كاملة. كل صفحة فيها حكمة جديدة وقصة جديدة من قلب الجنينة.\n\n`;
else if(i<=10) txt+=`الفصل الأول: البدايات في الجنينة\n\nفي هذه الصفحة ${i} نحكي عن بدايات ${title}. أهل الجنينة زمان كانوا يجتمعون تحت شجرة كبيرة في وادي كجا. الحبوبة آمنة تحكي: "كنا صغار، نلعب في الطين، ونسمع قصص الأجداد".\n\nقصة اليوم: في سنة 1970، جاء تاجر من تشاد يحمل ملح وسكر. باع كل شيء في يوم واحد لأن أهل الجنينة كرماء.\n\nالحكمة: الكرم يجلب الرزق.\n\n`;
else if(i<=20) txt+=`الفصل الثاني: حكايات من السوق الكبير\n\nالصفحة ${i} - سوق الجنينة الكبير هو قلب المدينة. فيه كل شيء. من الفجر تسمع أصوات الباعة: "تعال يا زول، عندي طماطم طازة من وادي كجا".\n\nقصة: مرة جاء رجل يبيع عسل، قال هذا عسل أصلي. واحد من أهل الجبل ذاقه وقال لا، هذا سكر. الناس ضحكت والرجل هرب. من يومها أهل الجنينة يعرفون العسل الأصلي.\n\n`;
else if(i<=30) txt+=`الفصل الثالث: حكم وامثال\n\nالصفحة ${i} - مثل اليوم: "الصبر طيب".\n\nأهل الجنينة صبورون. يزرعون في الخريف وينتظرون المطر. لو المطر تأخر، لا ييأسون، يدعون الله ويصبرون.\n\nقصة صبر: امرأة زرعت دخن وانتظرت 3 شهور بدون مطر، كل يوم تسقيه بيدها من بئر بعيد. في النهاية نزل المطر وحصدت أكثر من الجميع.\n\n`;
else if(i<=40) txt+=`الفصل الرابع: تاريخ دار مساليت\n\nالصفحة ${i} - سلطنة دار مساليت حكمت 400 سنة. سلاطينها كانوا عادلين. السلطان بحر الدين، السلطان تاج الدين، كلهم كانوا يجلسون مع الناس.\n\nفي هذه الصفحة نحكي كيف كان السلطان يحل المشاكل: يجمع الطرفين تحت الشجرة، يسمع كل واحد، ثم يحكم بالعدل. لا يفرق بين غني وفقير.\n\n`;
else txt+=`الفصل الخامس: الجنينة اليوم والمستقبل - الخاتمة\n\nالصفحة ${i} - وصلنا لنهاية الكتاب، لكن بداية المستقبل. الجنينة اليوم فيها جامعة، مستشفى، مدارس. شبابها يبنونها بالعلم.\n\nرسالة لك يا قارئ الصفحة ${i}: أنت جزء من تاريخ الجنينة. احفظ قصصها، علمها لأولادك، واكتب صفحة جديدة.\n\nلو وصلت الصفحة ${i} فأنت بطل! كمل لحدي 50 وتكون قريت كتاب كامل!\n\n`;
txt+=`\n---\nمكتبة الجنينة الرقمية - غرب دارفور - 2026 - صفحة ${i} من 50`;
pages.push(txt);
}
return pages;
}

let allBooks=[
{name:"تاريخ الجنينة - 50 صفحة", cat:"دار", pages: genBook("تاريخ الجنينة","دار","تاريخ مدينة الجنينة من التأسيس حتى اليوم. الجنينة سميت جنينة لأنها كانت كلها جناين حول وادي كجا.")},
{name:"السلطان تاج الدين - 50 صفحة", cat:"دار", pages: genBook("السلطان تاج الدين","دار","حكاية السلطان العادل تاج الدين، الذي كان يمشي حافيا مع المسكين ليحقق العدل. قصره من طين لكن عدله من ذهب.")},
{name:"الأمثال الدارفورية - 50 صفحة", cat:"تراث", pages: genBook("الأمثال الدارفورية","تراث","الأمثال الدارفورية هي جامعة كاملة. كل مثل فيه حكمة 100 سنة. جمعنا 50 مثل من أفواه الحبوبات في سوق الجنينة.")},
{name:"موسم الهجرة - 50 صفحة", cat:"أدب", pages: genBook("موسم الهجرة","أدب","موسم الهجرة إلى الشمال للطيب صالح. قصة مصطفى سعيد الذي سافر لندن ورجع. صراع بين الشرق والغرب، بين القرية والمدينة.")}
];

let currentBook=null, currentPage=0;
let favs=JSON.parse(localStorage.getItem('favs')||'[]');
fetch('https://api.countapi.xyz/hit/geneina-50-pages-final/visits').then(r=>r.json()).then(d=>{
document.getElementById('vis').innerText='👁️ الزوار: '+d.value;
}).catch(()=>{document.getElementById('vis').innerText='👁️ الزوار: 150+';});

function render(list){
document.getElementById('books').innerHTML=list.map((b,i)=>{
let idx=allBooks.indexOf(b);
return `<div class="book"><div class="cover">${b.name}<br><small>50 صفحة</small></div><div class="info"><span style="background:#c8e6c9;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:700">📖 50 صفحة - كتاب طويل</span><button class="btn" onclick="addFav('${b.name}')">⭐ حفظ</button><button class="btn btn-green" onclick="openBook(${idx})">📖 افتح - 50 صفحة</button></div></div>`;
}).join('');
}
function openBook(i){
currentBook=allBooks[i];
currentPage=0;
document.getElementById('rTitle').innerText=currentBook.name;
showPage();
document.getElementById('reader').style.display='flex';
}
function showPage(){
document.getElementById('readerContent').innerText=currentBook.pages[currentPage];
document.getElementById('pageInfo').innerText=(currentPage+1)+' / 50';
document.getElementById('prevBtn').disabled=currentPage==0;
document.getElementById('nextBtn').disabled=currentPage==49;
document.getElementById('progress').style.width=((currentPage+1)/50*100)+'%';
document.getElementById('readerContent').scrollTop=0;
}
function nextPage(){if(currentPage<49){currentPage++; showPage();}}
function prevPage(){if(currentPage>0){currentPage--; showPage();}}
function closeReader(){document.getElementById('reader').style.display='none';document.getElementById('progress').style.width='0%';}
function addFav(n){if(!favs.includes(n)){favs.push(n);localStorage.setItem('favs',JSON.stringify(favs));alert('✅ تم الحفظ في محفوظاتي - 50 صفحة');}else alert('محفوظ قبل كده');}
function showFavs(){if(!favs.length){alert('🔖 محفوظاتي فاضية\nاحفظ كتاب 50 صفحة');return;}alert('🔖 محفوظاتي - عندك '+favs.length+' كتاب:\n\n'+favs.join('\n'));}
function showAccount(){let name=localStorage.getItem('geneina_user')||'زائر';let nn=prompt('👤 حسابي\nاسمك الحالي: '+name+'\nاكتب اسم جديد:',name);if(nn){localStorage.setItem('geneina_user',nn);document.getElementById('userTop').innerText='👤 '+nn;}}
function goHome(){render(allBooks);}
render(allBooks);
let su=localStorage.getItem('geneina_user'); if(su) document.getElementById('userTop').innerText='👤 '+su;
</script>
</body>
</html>
