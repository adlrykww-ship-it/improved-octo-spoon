{name:"الأمثال الدارفورية - كتاب كامل",cat:"تراث",content:`
📚 كتاب الأمثال الدارفورية - جمع أهل الجنينة

المقدمة:
الأمثال في دارفور هي مدرسة كاملة. الحبوبات في الجنينة ما كانو بقرو كتب، لكن كان عندهم حكمة في مثل واحد.

الفصل الأول: أمثال عن الحكمة

1- "الجمل ما بشوف عوجة رقبتو"
القصة: مرة في سوق الجنينة، واحد بقى يضحك على جمل صاحبو رقبتو عوجاء. صاحب الجمل قال ليهو: وجملك انت؟ الزول عاين لقى جملو رقبتو أعوج أكتر.
المعنى: الناس بتشوف عيب غيرها وما بتشوف عيبها.
الاستخدام: لما زول ينتقد الناس وهو مليان عيوب.

2- "الايد الواحدة ما بتصفق"
القصة: في موسم الحصاد في وادي كجا، الناس كلها بتطلع تحصد سوا. لو زول واحد حصد براهو، ما بخلص. لكن لما يتعاونو، الحصاد بخلص في يوم.
المعنى: التعاون مهم.
في الجنينة اليوم بنستخدمو لما نقول للشباب لازم تتعاونو عشان تبنو البلد.

3- "جرادة في الكف ولا ألف طايرة"
القصة: صياد في الجنينة شاف ألف جرادة طايرة، جرى وراها، وفي يدو جرادة واحدة وقعت. لما رجع، لا لقى الطايرات ولا لقى الفي كفو.
المعنى: القليل المضمون أحسن من الكثير الما مضمون.
الحبوبات بقولوهو للبنات: الراجل الكويس القدامك أحسن من الغني البعيد.

4- "أهل مكة أدرى بشعابها"
في مشاكل دار مساليت، لما يجو ناس من برة يحلو المشكلة، أهل الجنينة بقولو: أهل الجنينة أدرى بمشاكلها. خلو أهلها يحلوها.

الفصل الثاني: أمثال عن الكرم
"الضيف ضيف الله"
أهل الجنينة لو جاك ضيف، حتى لو ما عندك إلا كسرة واحدة، بتقسمها معاهو.

"الجود بالموجود"
ما ضروري تكون غني عشان تكون كريم.

الخاتمة:
الأمثال دي ما كلام ساي، دي تاريخ دارفور كلو مكتوب في جملة واحدة. احفظها وعلمها لولادك.

{name:"حكاية السلطان تاج الدين - كاملة",cat:"دار",content:`
📚 حكاية السلطان تاج الدين - سلطان دار مساليت العادل

الفصل الأول: من هو تاج الدين؟
السلطان تاج الدين هو من أشهر سلاطين دار مساليت. حكم في زمن كان فيه العدل قليل. كان ساكن في الجنينة، في قصر من الطين والقش، لكن هيبتو كانت تملأ دارفور كلها.

كان طويل، لابس جلابية بيضاء وطاقية خضراء، وعندو عصاية من الأبنوس. الناس كانت تحبو لأنه كان بيسمع للصغير قبل الكبير.

الفصل الثاني: قصة المسكين والبقرة
في يوم من الأيام، في صباح بدري، جاء راجل مسكين من وادي كجا، لابس مقطع، وبكى قدام السلطان.

قال: يا سلطان، جاري محمد شال بقرتي الوحيدة، وهي كل ما أملك، بحلبها لعيالي.

السلطان قال: عندك شهود؟

المسكين قال: ما عندي إلا الله. الجماعة كلهم بخافو من محمد لأنه غني.

السلطان قام طوالي، ما رسل حرس، هو بنفسو مشى مع المسكين، ماشين كداري لحدي بيت الغني.

لما وصلو، لقو البقرة مربوطة، وفي رقبتها علامة المسكين.

السلطان سأل الغني: دي بقرتك؟

الغني قال: أي بقرتي، اشتريتها من السوق.

السلطان قال: السوق وين؟ ومنو الشاهد؟

الغني سكت.

السلطان حكم: البقرة ترجع للمسكين، والغني يدفع غرامة 2 بقرة للمسكين عشان كذب.

ومن يومها، أهل الجنينة بقو يقولو: "عدل تاج الدين".

الفصل الثالث: حكمه المشهور
تاج الدين كان عندو قانون: "لو سرق الغني، تقطع يدو، ولو سرق الفقير، تقطع يد الحاكم لأنه ما وفر ليهو أكل".

الناس كانت تأمن في عهدو، حتى أن المرأة كانت تمشي من الجنينة لحدي وادي كجا براها، ما في زول بتعرض ليها.

الفصل الرابع: وفاته
مات تاج الدين وهو ساجد، بعد ما صلى بالناس الفجر. دفنوه في الجنينة، وقبرو لحدي اليوم الناس بتزورو.

العبرة: العدل بخلي اسمك يعيش مئات السنين.

رواها: الحاج إبراهيم - 85 سنة - حي الزهور - الجنينة
كتبها: مكتبة الجنينة الرقمية

{name:"تاريخ الجنينة - من التأسيس لليوم",cat:"دار",content:`
📚 تاريخ مدينة الجنينة - غرب دارفور

الباب الأول: لماذا سميت الجنينة؟
زمان، المنطقة دي كانت كلها جناين وخضرة. وادي كجا كان مليان موية طول السنة، والناس زرعت حولو نخل ومنقة وجوافة. المسافرين كانو لما يجيو، بقولو: "دخلنا الجنينة" يعني دخلنا مكان الجناين. فبقى اسمها الجنينة.

الباب الثاني: تأسيس سلطنة دار مساليت
قبل 400 سنة، اجتمعو كبار القبائل في دار مساليت، وقالو لازم نعمل سلطنة تحمينا. اختارو أول سلطان، وبنو أول قصر في مكان السوق الكبير هسا.

السلطنة كانت بتحكم بالشورى. السلطان ما بحكم براهو، عندو مجلس من 12 راجل حكيم من كل القبائل.

الباب الثالث: الجنينة في الاستعمار
لما جا الإنجليز، حاولو يدخلو الجنينة، لكن أهلها قاومو. معركة كرندق مشهورة، أهل الجنينة هزمو الإنجليز هناك.

الإنجليز بعدها عملو اتفاقية مع السلطان: السلطان يحكم داخليا، والإنجليز برة.

الباب الرابع: أحياء الجنينة
1- حي الزهور: أقدم حي، فيه ناس طيبين
2- حي الجبل: فوق الجبل، هواءه جميل
3- حي السلام: سكنو فيه ناس من كل دارفور
4- السوق الكبير: قلب الجنينة النابض، فيه أي حاجة دايرها
5- وادي كجا: المتنفس، الناس بتمشي هناك العصر

الباب الخامس: الجنينة اليوم
الجنينة اليوم فيها أكثر من 500 ألف نسمة. فيها جامعة الجنينة، فيها مستشفى كبير، فيها مدارس كثيرة.

رغم الحرب الأخيرة، أهل الجنينة ما طلعو، قعدو عمروها.

أهل الجنينة مشهورين بالتجارة. بيمشو لحدي تشاد وأفريقيا الوسطى يجيبو بضاعة.

الباب السادس: مستقبل الجنينة
الجنينة حتبقى عاصمة الثقافة في دارفور. بمكتبتك دي يا ولدي، انت بتبني المستقبل.

لو عندك قصة عن الجنينة، رسلها لينا نضيفها في الكتاب.

تأليف: شباب مكتبة الجنينة الرقمية - 2026

{name:"موسم الهجرة - القصة الكاملة",cat:"أدب",content:`
📚 موسم الهجرة إلى الشمال - الطيب صالح - النسخة الكاملة المختصرة

الفصل الأول: العودة
الراوي رجع من لندن بعد 7 سنين دراسة. رجع لقريتو الصغيرة على النيل، لقى الناس نفس الناس، والنخلة نفس النخلة. لكن لقى زول جديد ساكن في القرية، اسمو مصطفى سعيد.

مصطفى سعيد زول غامض، ساكن براهو، ما بتكلم كتير. الناس بتقول جاي من الخرطوم.

الفصل الثاني: التعارف
الراوي اتعرف على مصطفى سعيد بالصدفة، لما كانو في بيت العمدة. مصطفى سكر وقال قصيدة بالإنجليزي. الراوي استغرب: زول في القرية دي حافظ إنجليزي؟

بعدها، مصطفى عزم الراوي لبيتو. البيت من برة عادي، لكن جوة كان فيه أوضة سرية مليانة كتب إنجليزية وصور بنات خواجات.

مصطفى بدا يحكي قصتو.

الفصل الثالث: مصطفى في لندن
مصطفى سعيد كان عبقري. مشى لندن وهو صغير، درس اقتصاد. كان أول سوداني يدرس هناك. البريطانيين كانو معجبين بذكائه.

لكن مصطفى كان عندو عقدة: داير ينتقم من الاستعمار. فبقى يغوي البنات الإنجليزيات ويكسر قلوبهن، عشان ينتقم لأمه السودان.

اتزوج وحدة اسمها جين موريس، لكن العلاقة كانت مسمومة. في النهاية قتلها وقتل نفسو؟ ولا لا؟ الرواية ما بتوضح.

الفصل الرابع: العودة للسودان
مصطفى رجع السودان، اتزوج بت بلد، اسمها حسنة، وعاش حياة بسيطة. لكن ماضيه ما خلاهو.

في يوم، اختفى مصطفى في النيل. الناس قالو غرق، الناس قالو هرب.

الراوي بقى يسأل: هل مصطفى كان ضحية للاستعمار؟ ولا كان هو المستعمر الجديد؟

الفصل الخامس: المعنى
الطيب صالح داير يقول: نحن السودانيين، بين ثقافتين، بين الشمال والجنوب، بين الشرق والغرب. لازم نلقى هويتنا.

الرواية دي بتوري أن الهجرة ما بس سفر، هجرة داخلية جوا النفس.

النهاية: الراوي واقف على النيل، محتار، بين يرجع لندن ولا يقعد في قريتو.

رواية لازم أي سوداني يقراها.
`}
];

let favs=JSON.parse(localStorage.getItem('favs')||'[]');
fetch('https://api.countapi.xyz/hit/geneina-full-books-2026/visits').then(r=>r.json()).then(d=>{
document.getElementById('vis').innerText='👁️ الزوار: '+d.value;
}).catch(()=>{document.getElementById('vis').innerText='👁️ الزوار: 6+';});

function render(list){
document.getElementById('books').innerHTML=list.map((b,i)=>`
<div class="book"><div class="cover">${b.name}</div>
<div class="info">${b.name}<br><span style="background:#c8e6c9;padding:3px 10px;border-radius:10px">📖 كتاب كامل - ${b.content.length} حرف</span>
<button class="btn" onclick="addFav('${b.name}')">⭐ حفظ</button>
<button class="btn btn-green" onclick="readReal(${allBooks.indexOf(b)})">📖 اقرا الكتاب كامل</button>
</div></div>`).join('');
}
function readReal(i){
let b=allBooks[i];
document.getElementById('rTitle').innerText=b.name + ' - انزل لتحت للقراءة';
document.getElementById('readerContent').innerText=b.content;
document.getElementById('reader').style.display='flex';
window.scrollTo(0,0);
}
function closeReader(){document.getElementById('reader').style.display='none';}
function addFav(name){if(!favs.includes(name)){favs.push(name); localStorage.setItem('favs',JSON.stringify(favs)); alert('✅ تم الحفظ')}else{alert('محفوظ قبل كده')}}
function showFavs(){alert(favs.length? 'محفوظاتك:\n'+favs.join('\n') : 'لسه ما حفظت')}
function goHome(){render(allBooks); window.scrollTo(0,0)}
render(allBooks);
</script>
